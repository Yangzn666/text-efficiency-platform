<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清除学习数据并重新初始化</title>
  <style>
    body {
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      text-align: center;
    }
    h1 {
      color: #667eea;
      margin-bottom: 20px;
    }
    .status {
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.6;
    }
    .loading {
      background: #e3f2fd;
      color: #1976d2;
    }
    .success {
      background: #e8f5e9;
      color: #388e3c;
    }
    .error {
      background: #ffebee;
      color: #d32f2f;
    }
    .info {
      background: #fff3e0;
      color: #f57c00;
      margin-top: 20px;
      text-align: left;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .danger {
      background: #f44336;
    }
    .danger:hover {
      background: #d32f2f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗑️ 清除旧数据并重新初始化</h1>
    
    <div id="status" class="status loading">
      ⏳ 准备清除旧的学习数据...
    </div>
    
    <div style="margin-top: 30px;">
      <button onclick="clearAndReinit()" class="danger">清除并重新初始化</button>
    </div>
    
    <div class="info">
      <strong>💡 为什么要这样做？</strong><br>
      1. 清除IndexedDB中的旧数据<br>
      2. 让网站重新运行初始化逻辑<br>
      3. 自动添加5月5日的英语学习记录（100分钟）<br>
      4. 刷新页面即可看到正确数据<br><br>
      <strong>⚠️ 注意：</strong>这会清除所有旧的学习记录！
    </div>
  </div>

  <script>
    function clearAndReinit() {
      const statusDiv = document.getElementById('status');
      statusDiv.className = 'status loading';
      statusDiv.innerHTML = '⏳ 正在清除旧数据...';
      
      try {
        // 清除IndexedDB
        const request = indexedDB.deleteDatabase('localforage');
        
        request.onsuccess = function() {
          console.log('✅ IndexedDB已清除');
          
          // 也清除localStorage的备份
          localStorage.removeItem('studyRecords');
          localStorage.removeItem('subjectProgress');
          localStorage.removeItem('studyData');
          
          console.log('✅ localStorage已清除');
          
          statusDiv.className = 'status success';
          statusDiv.innerHTML = 
            '✅ 数据清除成功！<br>' +
            '🔄 现在请：<br>' +
            '1. 关闭此窗口<br>' +
            '2. 刷新考研平台页面（Ctrl+Shift+R）<br>' +
            '3. 查看学习时长应显示1.67小时（100分钟）';
          
          // 5秒后自动关闭
          setTimeout(() => {
            window.close();
          }, 5000);
        };
        
        request.onerror = function(e) {
          console.error('清除IndexedDB失败:', e);
          // 即使IndexedDB清除失败，也继续清除localStorage
          localStorage.removeItem('studyRecords');
          localStorage.removeItem('subjectProgress');
          localStorage.removeItem('studyData');
          
          statusDiv.className = 'status success';
          statusDiv.innerHTML = 
            '✅ localStorage已清除（IndexedDB可能需要手动清除）<br>' +
            '🔄 请刷新考研平台页面';
          
          setTimeout(() => {
            window.close();
          }, 3000);
        };
        
      } catch (error) {
        console.error('清除失败:', error);
        statusDiv.className = 'status error';
        statusDiv.innerHTML = '❌ 清除失败：' + error.message;
      }
    }
    
    // 页面加载后自动执行
    window.onload = function() {
      setTimeout(() => {
        document.getElementById('status').innerHTML = '⏳ 点击"清除并重新初始化"按钮开始';
      }, 500);
    };
  </script>
</body>
</html>
