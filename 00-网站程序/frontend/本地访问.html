<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考研效率平台 - 本地版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.2rem;
        }
        
        .navigation {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .nav-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }
        
        .nav-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .nav-item h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        
        .nav-item p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .local-files {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }
        
        .local-files h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .file-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        
        .file-item h4 {
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .file-path {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #666;
            word-break: break-all;
        }
        
        .warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

        <div class="header">

            <strong>💡 提示：</strong>这是简化版界面，完整功能需要通过开发服务器运行。

            </a>
            
            <a href="file:///D:/学习/线代/线性代数考研巩固项目/线性代数学习系统.html" class="nav-item" target="_blank">
                <h3>🔢 线性代数</h3>
                <p>专项学习与练习系统</p>
            </a>
        </div>
        
        <div class="local-files">
            <h2>📁 本地学习资源</h2>
            <div class="file-list">
                <div class="file-item">

                </div>
            </div>
        </div>
    </div>
</body>
</html>
