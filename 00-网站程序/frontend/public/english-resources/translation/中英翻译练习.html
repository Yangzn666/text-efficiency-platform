        }
        
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;

        }
        
        .flip-card-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);

            transform: rotateY(180deg);
        }
        
        .progress-bar {
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;

        }

            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {

                chinese: "节能减排",
                english: "energy conservation and emission reduction"
            },
            {
                chinese: "绿色发展",
                english: "green development"
            },
            {
                chinese: "空气污染",
                english: "air pollution"
            },
            {
                chinese: "基础设施",
                english: "infrastructure"
            },
            {
                chinese: "城市人口",
                english: "urban population"
            },
            {
                chinese: "农村人口",
                english: "rural population"
            },
            {
                chinese: "人口激增",
                english: "population explosion"
            },
            {
                chinese: "第三产业",
                english: "tertiary industry"
            },
            {
                chinese: "过度工业化",
                english: "over-industrialization"
            },
            {
                chinese: "交通拥堵",
                english: "traffic congestion"
            },
            {
                chinese: "水资源短缺",
                english: "water scarcity"
            },
            {
                chinese: "环境恶化",
                english: "environmental degradation"
            },
            {
                chinese: "资源枯竭",
                english: "resources exhaustion"
            }
        ];

        // 应用状态
        let currentIndex = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let masteredWords = new Set();

        // DOM元素
        const englishWordEl = document.getElementById('english-word');
        const chineseMeaningEl = document.getElementById('chinese-meaning');
        const userInputEl = document.getElementById('user-input');
        const currentIndexEl = document.getElementById('current-index');
        const totalCountEl = document.getElementById('total-count');
        const correctCountEl = document.getElementById('correct-count');
        const incorrectCountEl = document.getElementById('incorrect-count');
        const progressFillEl = document.getElementById('progress-fill');
        const flashcardEl = document.getElementById('flashcard');
        const resultMessageEl = document.getElementById('result-message');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const resetBtn = document.getElementById('reset-btn');
        const vocabularyListEl = document.getElementById('vocabulary-list');

        // 初始化应用
        function initApp() {
            totalCountEl.textContent = vocabularyData.length;
            renderVocabularyList();
            showCurrentWord();
            updateProgress();
        }

        // 显示当前词组
        function showCurrentWord() {
            if (currentIndex >= vocabularyData.length) {
                // 完成所有练习
                showCompletionMessage();
                return;
            }

            const word = vocabularyData[currentIndex];
            chineseMeaningEl.textContent = word.chinese;
            englishWordEl.textContent = word.english;
            userInputEl.value = '';
            currentIndexEl.textContent = currentIndex + 1;
            resultMessageEl.classList.add('hidden');
            
            // 重置卡片状态
            flashcardEl.classList.remove('flipped');
        }

        // 更新进度条
        function updateProgress() {
            const progress = ((currentIndex) / vocabularyData.length) * 100;
            progressFillEl.style.width = `${progress}%`;
        }

        // 更新计数器
        function updateCounters() {
            correctCountEl.textContent = correctCount;
            incorrectCountEl.textContent = incorrectCount;
        }

        // 检查答案
        function checkAnswer() {
            const userAnswer = userInputEl.value.trim().toLowerCase().replace(/\s+/g, ' ');
            const correctAnswer = vocabularyData[currentIndex].english.toLowerCase().replace(/\s+/g, ' ');
            
            resultMessageEl.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            // 检查答案是否正确（允许部分匹配）
            if (userAnswer === correctAnswer || correctAnswer.includes(userAnswer) && userAnswer.length > 0) {
                // 答案正确
                resultMessageEl.classList.add('bg-green-100', 'text-green-800');
                resultMessageEl.innerHTML = `
                    <div class="flex items-center">
                        <svg class="h-5 w-5 text-green-500 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                        </svg>
                        <span>回答正确！</span>
                    </div>
                `;
                correctCount++;
                masteredWords.add(currentIndex);
            } else {
                // 答案错误
                resultMessageEl.classList.add('bg-red-100', 'text-red-800');
                resultMessageEl.innerHTML = `
                    <div class="flex items-start">
                        <svg class="h-5 w-5 text-red-500 mr-2 mt-0.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                        <div>
                            <div>回答错误！</div>
                            <div class="text-sm mt-1">正确答案：<strong>${vocabularyData[currentIndex].english}</strong></div>
                        </div>
                    </div>
                `;
                incorrectCount++;
            }
            
            updateCounters();
            renderVocabularyList();
        }

        // 显示下一个词组
        function showNextWord() {
            currentIndex++;
            if (currentIndex < vocabularyData.length) {
                showCurrentWord();
                updateProgress();
            } else {
                // 完成所有练习
                showCompletionMessage();
            }
        }

        // 显示完成消息
        function showCompletionMessage() {
            chineseMeaningEl.textContent = "练习完成！";
            englishWordEl.textContent = `您已完成所有 ${vocabularyData.length} 个词组的练习`;
            userInputEl.disabled = true;
            checkBtn.disabled = true;
            nextBtn.disabled = true;
            
            resultMessageEl.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            resultMessageEl.classList.add('bg-blue-100', 'text-blue-800');
            resultMessageEl.innerHTML = `
                <div class="flex items-center">
                    <svg class="h-5 w-5 text-blue-500 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                    </svg>
                    <span>恭喜！您已完成所有词汇练习。正确率：${Math.round((correctCount / vocabularyData.length) * 100)}%</span>
                </div>
            `;
        }

        // 重置练习
        function resetPractice() {
            currentIndex = 0;
            correctCount = 0;
            incorrectCount = 0;
            masteredWords.clear();
            userInputEl.disabled = false;
            checkBtn.disabled = false;
            nextBtn.disabled = false;
            showCurrentWord();
            updateProgress();
            updateCounters();
            renderVocabularyList();
        }

        // 渲染词汇列表
        function renderVocabularyList() {
            vocabularyListEl.innerHTML = vocabularyData.map((word, index) => `
                <tr class="${index === currentIndex ? 'bg-indigo-50' : ''}">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${word.chinese}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${word.english}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        ${masteredWords.has(index) ? 
                            '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">已掌握</span>' : 
                            '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">待练习</span>'
                        }
                    </td>
                </tr>
            `).join('');
        }

        // 事件监听器
        flashcardEl.addEventListener('click', () => {
            flashcardEl.classList.toggle('flipped');
        });

        checkBtn.addEventListener('click', checkAnswer);

        nextBtn.addEventListener('click', showNextWord);

        resetBtn.addEventListener('click', resetPractice);

        // 初始化应用
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
